name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun install --frozen-lockfile

      # typecheck + test + build. The same command a contributor runs locally,
      # so a green CI and a green laptop mean the same thing.
      - name: Verify
        run: bun run verify

      - name: Packaging
        run: bun pm pack --destination /tmp/pack
